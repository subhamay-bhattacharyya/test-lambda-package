[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-lambda-function"
version = "0.1.0"
description = "Python port of the repo-tracker Lambda logging utilities (Powertools for AWS Lambda)"
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.41,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]